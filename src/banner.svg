<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="João Alcino — Developer &amp; Designer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B16"/>
      <stop offset="0.55" stop-color="#0B2A4A"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.05" r="0.65">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="1" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7DD3FC" stroke-opacity="0.09"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .m { font-family: 'Fira Code','SFMono-Regular',Consolas,monospace; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    .blink { animation: blink 1.1s steps(2,start) infinite; }
    @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    @keyframes blink { to { visibility: hidden } }
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect class="pulse" width="1200" height="300" fill="url(#glow)"/>
    <rect width="1200" height="300" fill="url(#glow2)"/>
    <circle cx="1090" cy="60" r="150" fill="none" stroke="#BAE6FD" stroke-opacity="0.12"/>
    <circle cx="1090" cy="60" r="95" fill="none" stroke="#BAE6FD" stroke-opacity="0.12"/>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#7DD3FC" stroke-opacity="0.25"/>

  <text x="600" y="92" text-anchor="middle" class="m" font-size="15" fill="#7DD3FC" letter-spacing="2">// full stack · maputo, moçambique</text>
  <text x="600" y="170" text-anchor="middle" class="t" font-size="72" font-weight="700" fill="#FFFFFF" letter-spacing="1">João Alcino</text>
  <rect x="380" y="195" width="440" height="2" fill="url(#rule)"/>
  <text x="600" y="238" text-anchor="middle" class="t" font-size="21" font-weight="500" fill="#BAE6FD" letter-spacing="9">DEVELOPER  &amp;  DESIGNER</text>

  <text x="70" y="165" class="m" font-size="64" fill="#7DD3FC" fill-opacity="0.55">&lt;</text>
  <text x="1130" y="165" text-anchor="end" class="m" font-size="64" fill="#7DD3FC" fill-opacity="0.55">/&gt;</text>
</svg>
